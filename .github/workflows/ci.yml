name: Fork CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - run: npm ci
        working-directory: dashboard-ui
      - run: npm run build
        working-directory: dashboard-ui
      - run: git diff --exit-code -- src/dashboard/ui/
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - run: bash scripts/test-installer-services.sh
      - name: Exercise join bootstrap paths in an isolated container
        run: docker run --rm --network none --mount "type=bind,source=$PWD,target=/repo,readonly" ubuntu:22.04 bash /repo/scripts/test-join.sh
      - run: cargo test --locked --no-default-features --features dashboard --lib
      - run: cargo test --locked --no-default-features --features dashboard --test fleet_cli
      - run: cargo check --locked --no-default-features
      - run: cargo check --locked --no-default-features --features dashboard
      - name: Install native TLS build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config g++
      - run: cargo check --locked
